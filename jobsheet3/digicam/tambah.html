<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DIGIRENT | Tambah Digicam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#d9469d;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">DIGIRENT</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Katalog Digicam</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Digicam</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pelanggan/list.html">Daftar Pelanggan</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pelanggan/tambah.html">Tambah Pelanggan</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3" style="color:#d9469d;">Tambah Digicam</h2>
                <form>
                    <div class="mb-3">
                        <label for="nama_kamera" class="form-label fw-semibold">Nama Kamera</label>
                        <input type="text" class="form-control" id="nama_kamera" name="nama_kamera" required>
                    </div>
                    <div class="mb-3">
                        <label for="kategori" class="form-label fw-semibold">Kategori</label>
                        <input type="text" class="form-control" id="kategori_kamera" name="kategori_kamera" required>
                    </div>
                    <div class="mb-3">
                        <label for="tarif" class="form-label fw-semibold">Tarif per Hari (Rp)</label>
                        <input type="number" class="form-control" id="tarif" name="tarif" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label for="kondisi" class="form-label fw-semibold">Kondisi Kamera</label>
                        <input type="text" class="form-control" id="kondisi" name="kondisi">
                    </div>
                    <div class="mb-3">
                        <label for="stok" class="form-label fw-semibold">Stok Ready</label>
                        <input type="number" class="form-control" id="stok" name="stok" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label for="kategori" class="form-label fw-semibold">Kategori</label>
                        <select class="form-select" id="kategori" name="kategori">
                            <option value="pocket">Pocket Digicam</option>
                            <option value="y2k">Y2K Aesthetic</option>
                            <option value="selfie">Selfie Digicam</option>
                        </select>
                    </div>
                    <button type="submit" class="btn" style="background-color:#d9469d; color:#fff;">Simpan</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 DIGIRENT &mdash; System Management Rental Digicam</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
