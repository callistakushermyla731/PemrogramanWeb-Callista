<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PinjamBooku | Daftar Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-body-tertiary">
    <header class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" style="background-color: #d63384;">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="../index.html">
                <span>📚</span> PinjamBooku
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2 d-flex align-items-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-light text-pink fw-bold px-3 btn-sm rounded-pill" style="color:#d63384;" href="../login.html">Login</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 bg-white border-bottom">
                <div class="row align-items-center g-3">
                    <div class="col-md-6">
                        <h4 class="fw-bold mb-1" style="color:#d63384;">Katalog Buku Perpustakaan</h4>
                        <p class="text-muted small mb-0" id="table-counter">Memuat jumlah data...</p>
                    </div>
                    <div class="col-md-6">
                        <div class="d-flex gap-2 justify-content-md-end align-items-center">
                            <button type="button" id="btn-reload" class="btn btn-outline-danger btn-sm rounded-pill px-3 text-nowrap">
                                🔄 Refresh
                            </button>
                            <input type="text" id="search-input" class="form-control form-control-sm rounded-pill" style="max-width: 220px;" placeholder="Cari buku...">
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="tabel-buku">
                    <thead class="table-light">
                        <tr class="text-secondary small text-uppercase">
                            <th class="ps-4">Judul Buku</th>
                            <th>Pengarang</th>
                            <th>Tahun</th>
                            <th>Stok</th>
                            <th>Kategori</th>
                            <th class="text-end pe-4">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4 small border-top mt-auto bg-white">
        <p class="mb-0">&copy; 2026 <strong>PinjamBooku</strong> &mdash; Jobsheet 6 (Fetch API & JSON)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/data-loader.js"></script>
    <script>
        function muatDaftarBuku() {
            loadGenerikData('../data/buku.json', '#tabel-buku', ['judul', 'pengarang', 'tahun', 'stok', 'kategori']);
        }

        document.addEventListener("DOMContentLoaded", function() {
            muatDaftarBuku();
            document.getElementById("btn-reload")?.addEventListener("click", function() {
                muatDaftarBuku();
            });
        });
    </script>
</body>
</html>
