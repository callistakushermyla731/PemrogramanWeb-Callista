<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>DIGIRENT | Tambah Pelanggan</title>
</head>
<body>
    <header>
        <h1>DIGIRENT</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../digicam/list.html">Katalog Digicam</a></li>
                <li><a href="../digicam/tambah.html">Tambah Digicam</a></li>
                <li><a href="list.html">Daftar Pelanggan</a></li>
                <li><a href="tambah.html">Tambah Pelanggan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Pelanggan</h2>
            <form action="#" method="post">
                <p>
                    <label for="no_anggota">No. Pelanggan</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email">
                </p>
                <p>
                    <label for="alamat">Email</label><br>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="tel" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 DIGIRENT &mdash; System Management Rental Digicam</p>
    </footer>
</body>
</html>
