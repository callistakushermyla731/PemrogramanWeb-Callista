<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Masuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
    <!-- Navigasi Bar -->
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#d63384;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Masuk</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Form Login Statis -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4 fw-bold" style="color:#d63384;">Masuk SIMPUS-Mini</h2>
                        
                        <!-- Form Tanpa Logika Backend (Statis) -->
                        <form action="#" method="POST" id="form-login">
                            <!-- Field Username / Email -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Nama Pengguna / Email</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username atau email..." required>
                            </div>

                            <!-- Field Password -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Kata Sandi</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan kata sandi..." required>
                            </div>

                            <!-- Tombol Submit -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn text-white fw-semibold" style="background-color:#d63384;">
                                    Masuk
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Form Login Statis</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
