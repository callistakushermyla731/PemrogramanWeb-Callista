<!DOCTYPE html>
<html lang="id">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#d63384;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h2 class="card-title mb-0" style="color:#d63384;">Daftar Buku</h2>
                    <input type="text" id="search-input" class="form-control w-25" placeholder="Cari judul buku...">
                </div>
                
                <div class="text-end text-muted mb-3">
                    <small id="table-counter">Memuat counter...</small>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="tabel-buku">
                        <thead style="background-color:#d63384;">
                            <tr class="text-white">
                                <th>Judul</th>
                                <th>Pengarang</th>
                                <th>Tahun</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <!-- tbody dikosongkan, akan diisi dinamis oleh buku.js -->
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6 (Fetch API & JSON)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
