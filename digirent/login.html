<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DIGIRENT | Login Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-body-tertiary">
    <header class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm py-3" style="background-color: #d63384;">
        <div class="container d-flex flex-column align-items-center position-relative">
            <div class="w-100 d-flex justify-content-center align-items-center mb-lg-2">
                <a class="navbar-brand text-white fw-bold display-5 fs-1 m-0" href="index.html">
                    DIGIRENT
                </a>
                <button class="navbar-toggler border-0 position-absolute end-0 top-0 mt-2" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <nav class="collapse navbar-collapse w-100 justify-content-center" id="navMenu">
                <ul class="nav nav-pills align-items-center gap-2 flex-column flex-lg-row justify-content-center mt-3 mt-lg-0">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="digicam/list.html">Katalog Digicam</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="digicam/tambah.html">Tambah Digicam</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="pelanggan/list.html">Daftar Pelanggan</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="pelanggan/tambah.html">Tambah Pelanggan</a></li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-light text-pink fw-bold px-4 btn-sm rounded-pill active" style="color:#d63384;" href="login.html">Login</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <span class="fs-1">🔑</span>
                            <h4 class="fw-bold mt-2" style="color:#d63384;">Masuk Admin</h4>
                            <p class="text-muted small">Silakan masuk ke panel manajemen</p>
                        </div>
                        <form action="#" method="POST" id="form-login">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username / Email</label>
                                <input type="text" class="form-control rounded-3" id="username" placeholder="admin@digirent.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Kata Sandi</label>
                                <input type="password" class="form-control rounded-3" id="password" placeholder="••••••••" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn text-white fw-semibold rounded-pill py-2" style="background-color:#d63384;">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4 small border-top mt-auto bg-white">
        <p class="mb-0">&copy; 2026 <strong>DIGIRENT</strong> &mdash; System Management Rental Digicam</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
