<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PinjamBooku | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-body-tertiary">
    <header class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" style="background-color: #d63384;">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="index.html">
                <span>📚</span> PinjamBooku
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2 d-flex align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="buku/tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="anggota/tambah.html">Tambah Anggota</a></li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-light text-pink fw-bold px-3 btn-sm rounded-pill active" style="color:#d63384;" href="login.html">Login</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <span class="fs-1">🔑</span>
                            <h4 class="fw-bold mt-2" style="color:#d63384;">Masuk Akun</h4>
                            <p class="text-muted small">Silakan isi kredensial akun Anda</p>
                        </div>
                        
                        <form action="#" method="POST" id="form-login">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Nama Pengguna / Email</label>
                                <input type="text" class="form-control rounded-3" id="username" placeholder="Masukkan username..." required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Kata Sandi</label>
                                <input type="password" class="form-control rounded-3" id="password" placeholder="Masukkan kata sandi..." required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn text-white fw-semibold rounded-pill py-2" style="background-color:#d63384;">
                                    Login
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4 small border-top mt-auto bg-white">
        <p class="mb-0">&copy; 2026 <strong>PinjamBooku</strong> &mdash; Jobsheet 6 (Wireframe Login)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
