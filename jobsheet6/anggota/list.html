<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Anggota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#d63384;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h2 class="card-title mb-0" style="color:#d63384;">Daftar Anggota</h2>
                    
                    <!-- Tombol & Form Filter (Sejajar Kesamping dengan text-nowrap) -->
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" id="btn-reload" class="btn btn-outline-secondary btn-sm text-nowrap">
                            🔄 Muat Ulang
                        </button>
                        <input type="text" id="search-input" class="form-control form-control-sm" style="width: 220px;" placeholder="Cari nama anggota...">
                    </div>
                </div>
                
                <div class="text-end text-muted mb-3">
                    <small id="table-counter">Memuat counter...</small>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="tabel-anggota">
                        <thead style="background-color:#d63384;">
                            <tr class="text-white">
                                <th>No. Anggota</th>
                                <th>Nama</th>
                                <th>Alamat</th>
                                <th>No. HP</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6 (Fetch API & JSON)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/data-loader.js"></script>
    <script>
        function muatDaftarAnggota() {
            loadGenerikData('../data/anggota.json', '#tabel-anggota', ['no_anggota', 'nama', 'alamat', 'no_hp']);
        }

        document.addEventListener("DOMContentLoaded", function() {
            muatDaftarAnggota();

            document.getElementById("btn-reload")?.addEventListener("click", function() {
                muatDaftarAnggota();
            });
        });
    </script>
</body>
</html>
