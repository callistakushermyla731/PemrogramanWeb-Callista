<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Anggota - Sistem Perpustakaan</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Sistem Informasi Perpustakaan</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="form-tambah-anggota">
            <h2>Formulir Tambah Anggota</h2>
            <form action="#" method="post">
                <p>
                    <label for="no_anggota">No. Anggota:</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="nama">Nama Lengkap:</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="alamat">Alamat:</label><br>
                    <textarea id="alamat" name="alamat" rows="3" required></textarea>
                </p>
                <p>
                    <label for="no_hp">No. HP:</label><br>
                    <input type="tel" id="no_hp" name="no_hp" required>
                </p>
                <p>
                    <button type="submit" id="btn-simpan-anggota" name="simpan">Simpan</button>
                    <button type="reset" id="btn-reset-anggota" name="reset">Batal</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistem Informasi Perpustakaan. All rights reserved.</p>
    </footer>
</body>
</html>
