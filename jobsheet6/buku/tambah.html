<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PinjamBooku | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-body-tertiary">
    <header class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" style="background-color: #d63384;">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="../index.html">
                <span>📚</span> PinjamBooku
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2 d-flex align-items-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-light text-pink fw-bold px-3 btn-sm rounded-pill" style="color:#d63384;" href="../login.html">Login</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h4 class="fw-bold mb-3" style="color:#d63384;">Registrasi Koleksi Buku Baru</h4>
                    <p class="text-muted small mb-4">Lengkapi formulir berikut untuk mendaftarkan buku ke dalam koleksi perpustakaan.</p>

                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Judul Buku</label>
                            <input type="text" class="form-control rounded-3" placeholder="Masukkan judul buku..." required>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Pengarang</label>
                                <input type="text" class="form-control rounded-3" placeholder="Nama penulis..." required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Kategori</label>
                                <select class="form-select rounded-3">
                                    <option selected>Pilih Kategori...</option>
                                    <option value="Pemrograman">Pemrograman</option>
                                    <option value="Sains">Sains</option>
                                    <option value="Fiksi">Fiksi</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Tahun Terbit</label>
                                <input type="number" class="form-control rounded-3" placeholder="2026" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Jumlah Stok</label>
                                <input type="number" class="form-control rounded-3" placeholder="1" required>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="list.html" class="btn btn-outline-secondary px-4 rounded-pill">Batal</a>
                            <button type="submit" class="btn text-white px-4 rounded-pill" style="background-color:#d63384;">Simpan Koleksi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4 small border-top mt-auto bg-white">
        <p class="mb-0">&copy; 2026 <strong>PinjamBooku</strong> &mdash; Jobsheet 6 (Fetch API & JSON)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
