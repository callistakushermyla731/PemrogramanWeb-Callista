<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DIGIRENT | Katalog Digicam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-body-tertiary">
    <header class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm py-3" style="background-color: #d63384;">
        <div class="container d-flex flex-column align-items-center position-relative">
            <div class="w-100 d-flex justify-content-center align-items-center mb-lg-2">
                <a class="navbar-brand text-white fw-bold display-5 fs-1 m-0" href="../index.html">
                    DIGIRENT
                </a>
                <button class="navbar-toggler border-0 position-absolute end-0 top-0 mt-2" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <nav class="collapse navbar-collapse w-100 justify-content-center" id="navMenu">
                <ul class="nav nav-pills align-items-center gap-2 flex-column flex-lg-row justify-content-center mt-3 mt-lg-0">
                    <li class="nav-item"><a class="nav-link text-white" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link text-white fw-semibold active" href="list.html">Katalog Digicam</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="tambah.html">Tambah Digicam</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="../pelanggan/list.html">Daftar Pelanggan</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="../pelanggan/tambah.html">Tambah Pelanggan</a></li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-light text-pink fw-bold px-4 btn-sm rounded-pill" style="color:#d63384;" href="../login.html">Login</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 bg-white border-bottom">
                <div class="row align-items-center g-3">
                    <div class="col-md-6">
                        <h4 class="fw-bold mb-1" style="color:#d63384;">Katalog Unit Digicam</h4>
                        <p class="text-muted small mb-0" id="table-counter">Memuat data kamera...</p>
                    </div>
                    <div class="col-md-6">
                        <div class="d-flex gap-2 justify-content-md-end align-items-center">
                            <button type="button" id="btn-reload" class="btn btn-outline-danger btn-sm rounded-pill px-3 text-nowrap">🔄 Refresh</button>
                            <input type="text" id="search-input" class="form-control form-control-sm rounded-pill" style="max-width: 220px;" placeholder="Cari tipe kamera...">
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="tabel-digicam">
                    <thead class="table-light">
                        <tr class="text-secondary small text-uppercase">
                            <th class="ps-4">Nama Kamera</th>
                            <th>Kategori</th>
                            <th>Tarif / Hari</th>
                            <th>Stok Ready</th>
                            <th>Kondisi</th>
                            <th class="text-end pe-4">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4 small border-top mt-auto bg-white">
        <p class="mb-0">&copy; 2026 <strong>DIGIRENT</strong> &mdash; Fetch API & JSON Data</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/data-loader.js"></script>
    <script>
        function muatDaftarDigicam() {
            loadGenerikData('../data/digicam.json', '#tabel-digicam', ['nama_kamera', 'kategori', 'tarif_per_hari', 'stok', 'kondisi']);
        }

        document.addEventListener("DOMContentLoaded", function() {
            muatDaftarDigicam();
            document.getElementById("btn-reload")?.addEventListener("click", function() {
                muatDaftarDigicam();
            });
        });
    </script>
</body>
</html>
